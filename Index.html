<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SHAPE-SEA 2026 Retreat Venue Poll</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--ink:#1f2a37;--mute:#6b7280;--line:#e4dccb;--acc:#2f5d8a;--acc2:#dbe7f3;--ok:#2e7d4f;--err:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181d;--card:#1d232b;--ink:#eef1f4;--mute:#9aa4b0;--line:#323a45;--acc:#7fb1e3;--acc2:#233446;--ok:#6cc58c;--err:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14181d;--card:#1d232b;--ink:#eef1f4;--mute:#9aa4b0;--line:#323a45;--acc:#7fb1e3;--acc2:#233446;--ok:#6cc58c;--err:#ff8a80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.4rem;margin:.3rem 0}
.sub{color:var(--mute);margin:0 0 16px}
.badge{display:inline-block;background:var(--acc2);color:var(--acc);padding:2px 10px;border-radius:99px;font-size:.85rem;font-weight:600}
.banner{padding:10px 14px;border-radius:10px;background:var(--acc2);margin:12px 0;font-size:.92rem}
.banner.err{color:var(--err);border:1px solid var(--err);background:transparent}
.vw{background:var(--card);border:2px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}
.vw.sel{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2)}
.th{display:block;width:100%;height:210px;object-fit:cover;object-position:top;cursor:zoom-in;background:var(--line)}
.hint{font-size:.78rem;color:var(--mute);padding:4px 14px 0}
.v{display:block;width:100%;text-align:left;background:transparent;color:var(--ink);border:0;padding:10px 14px 14px;font:inherit;cursor:pointer}
.v:disabled{cursor:default}
.vh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.vn{font-weight:700}
.vc{font-weight:700;color:var(--acc);white-space:nowrap}
.pick{display:inline-block;margin-top:6px;font-size:.82rem;font-weight:600;color:var(--acc)}
.bar{height:8px;background:var(--line);border-radius:99px;margin:8px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .4s}
.who{font-size:.85rem;color:var(--mute);word-break:break-word}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:16px 0}
label{display:block;font-weight:600;margin:10px 0 4px;font-size:.92rem}
input,textarea{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button.go{margin-top:14px;width:100%;padding:12px;border:0;border-radius:12px;background:var(--acc);color:var(--bg);font:inherit;font-weight:700;cursor:pointer}
button.go:disabled{opacity:.5;cursor:not-allowed}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer}
.msg{margin-top:10px;font-size:.92rem}.ok{color:var(--ok)}.bad{color:var(--err)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto}
h2{font-size:1.1rem;margin:24px 0 8px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:50;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px));flex-direction:column;gap:10px}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:85%;object-fit:contain;border-radius:8px}
#lb span{color:#fff;font-size:.9rem;text-align:center}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lang button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:4px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.lang button:first-child{border-radius:99px 0 0 99px}.lang button:last-child{border-radius:0 99px 99px 0;border-left:0}
.lang button.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.links{display:flex;gap:14px;padding:6px 14px 0;font-size:.85rem}
.links a{color:var(--acc);font-weight:600;text-decoration:none}
.rk{display:flex;gap:6px;padding:4px 14px 12px}
.rk button{flex:1;padding:8px 4px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:.85rem;font-weight:600;cursor:pointer}
.rk button.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.rk button:disabled{opacity:.5;cursor:default}
.vb{padding:10px 14px 0}
.rule{font-size:.85rem;color:var(--mute);margin:0 0 8px}
</style>
</head>
<body>
<main>
  <div class="top"><span class="badge" data-i="date"></span><div class="lang"><button id="l-th" type="button">ไทย</button><button id="l-en" type="button">EN</button></div></div>
  <h1>SHAPE-SEA 2026 Midterm Review Retreat &amp; MEAL Refresher Workshop</h1>
  <p class="sub" data-i="sub"></p><p class="rule" data-i="rule"></p>
  <div id="status" class="banner" hidden></div>
  <div id="venues"></div>
  <form id="f" hidden>
    <label for="nm" data-i="nm"></label>
    <input id="nm" maxlength="80" required autocomplete="name">
    <label for="org" data-i="org"></label>
    <input id="org" maxlength="80">
    <label for="cm" data-i="cm"></label>
    <textarea id="cm" rows="2" maxlength="300"></textarea>
    <button class="go" id="btn" type="button"></button>
    <div id="msg" class="msg" role="status"></div>
  </form>
  <section id="admin" hidden>
    <h2><span data-i="vl"></span> (<span id="tot">0</span>)</h2>
    <div class="scroll"><table><thead><tr id="th"></tr></thead><tbody id="rows"></tbody></table></div>
    <p><button class="ghost" id="csv" type="button"data-i="csv"></button></p>
  </section>
</main>
<div id="lb" role="dialog" aria-modal="true"><img alt=""><span></span></div>

  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=tr(e.dataset.i));
  $('l-th').className=lang==='th'?'on':'';$('l-en').className=lang==='en'?'on':'';
  const h=$('th');h.textContent='';tr('cols').forEach(c=>h.append(el('th',null,c)));
  document.title=lang==='th'?'โหวตสถานที่ SHAPE-SEA 2026':'SHAPE-SEA 2026 Retreat Venue Poll';
}
function setLang(l){lang=l;try{localStorage.setItem('lang',l)}catch(e){}statics();if(stText)status(stText,stErr);render();updBtn()}
function render(){
  const box=$('venues');box.textContent='';
  const sc={},f1={};VENUES.forEach(v=>{sc[v.id]=0;f1[v.id]=0});
  votes.forEach(x=>rk(x).forEach((id,i)=>{if(id in sc){sc[id]+=3-i;if(i===0)f1[id]++}}));
  const max=Math.max(1,...Object.values(sc));
  VENUES.forEach(v=>{
    const cur=ranks.indexOf(v.id);
    const w=el('div','vw'+(cur>=0?' sel':''));
    const im=document.createElement('img');im.className='th';im.src=IMGS[v.id];im.alt=v[lang];im.loading='lazy';im.onclick=()=>zoom(v);
    w.append(im,el('div','hint',tr('hint')));
    const L=el('div','links');
    const mk=(h,txt)=>{const a=el('a',null,txt);a.href=h;a.target='_blank';a.rel='noopener noreferrer';L.append(a)};
    mk(v.web||('https://www.google.com/search?q='+encodeURIComponent(v.q)),'🌐 '+tr(v.web?'web':'search'));
    mk('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(v.q),'📍 '+tr('map'));
    w.append(L);
    const b=el('div','vb');
    const h=el('div','vh');h.append(el('span','vn',v[lang]),el('span','vc',sc[v.id]+' '+tr('pts')));
    b.append(h);
    const d=lang==='th'?v.dt:v.de;if(d)b.append(el('div','who',d));
    const bar=el('div','bar'),i=document.createElement('i');i.style.width=(sc[v.id]/max*100)+'%';bar.append(i);b.append(bar);
    b.append(el('div','who',tr('first')+': '+f1[v.id]));
    const names=votes.filter(x=>rk(x).includes(v.id)).map(x=>x.name+' (#'+(rk(x).indexOf(v.id)+1)+')');
    if(names.length)b.append(el('div','who',names.join(', ')));
    w.append(b);
    if(canWrite){const R=el('div','rk');tr('rk').forEach((lb,r)=>{const bt=el('button',cur===r?'on':'',lb);bt.type='button';bt.onclick=()=>setRank(v.id,r);R.append(bt)});w.append(R)}
    box.append(w);
  });
  $('tot').textContent=votes.length;
  const tb=$('rows');tb.textContent='';
  votes.slice().sort((a,b)=>(a.ts||0)-(b.ts||0)).forEach(x=>{
    const r=rk(x),tr_=document.createElement('tr');
    [new Date(x.ts||0).toLocaleString(lang==='th'?'th-TH':'en-GB'),x.name,x.org||'',vn(r[0]),vn(r[1]),vn(r[2]),x.comment||''].forEach(c=>tr_.append(el('td',null,c)));
    tb.append(tr_);
  });
}
function updBtn(){
  const mine=votes.find(x=>x.uid===uid);
  $('btn').disabled=!(ranks[0]&&$('nm').value.trim());
  $('btn').textContent=tr(mine?'update':'submit');
}
async function submit(){
  const m=$('msg');m.className='msg bad';
  if(!ranks[0]){m.textContent=tr('need1');return}
  if(!ranks[1]&&ranks[2]){m.textContent=tr('gap');return}
  const btn=$('btn');btn.disabled=true;m.className='msg';m.textContent=tr('saving');
  try{
    await db.doc('votes/'+uid).set({uid,ranks:ranks.filter(Boolean),name:$('nm').value.trim(),org:$('org').value.trim(),comment:$('cm').value.trim(),ts:Date.now()});
    m.className='msg ok';m.textContent=tr('ok');
  }catch(e){m.className='msg bad';m.textContent=tr('fail')+' ('+(e&&e.code||'error')+')'}
  updBtn();
}
function csvCell(s){s=String(s==null?'':s);if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
async function exportCsv(){
  const rows=[['Time','Name','Organization','1st choice','2nd choice','3rd choice','Comment']];
  votes.slice().sort((a,b)=>a.ts-b.ts).forEach(x=>{const r=rk(x);rows.push([new Date(x.ts).toISOString(),x.name,x.org,r[0]?VENUES.find(v=>v.id===r[0]).en:'',r[1]?VENUES.find(v=>v.id===r[1]).en:'',r[2]?VENUES.find(v=>v.id===r[2]).en:'',x.comment])});
  try{await downloads.save({filename:'shape-sea-venue-votes.csv',data:'\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\n')})}catch(e){}
}
async function init(){
  $('l-th').onclick=()=>setLang('th');$('l-en').onclick=()=>setLang('en');
  statics();render();updBtn();
  if(!window.claude){status('noapi',true);return}
  db=await claude.use('db');const user=await claude.use('user');downloads=await claude.use('downloads');
  if(!db){status('nodb',true);return}
  const me=user?await user.me():null;uid=me&&me.id;isOwner=!!(me&&me.isOwner);
  const cw=user?await user.can('data.write'):null;
  canWrite=!!uid&&cw!==false;
  if(!canWrite)status('ro',true);else $('f').hidden=false;
  if(me&&me.name)$('nm').value=me.name;
  $('nm').addEventListener('input',updBtn);$('btn').onclick=submit;$('csv').onclick=exportCsv;
  if(!downloads)$('csv').hidden=true;
  $('admin').hidden=!isOwner;
  db.collection('votes').onSnapshot(s=>{
    votes=s.docs.map(d=>d.data());
    const mine=votes.find(x=>x.uid===uid);
    if(mine&&!filled){filled=true;const r=rk(mine);ranks=[r[0]||null,r[1]||null,r[2]||null];$('nm').value=mine.name||$('nm').value;$('org').value=mine.org||'';$('cm').value=mine.comment||''}
    render();updBtn();
  },e=>status('loadfail',true));
}
init();
</script>
</body>
</html>
